<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Door Checker — Grupo Now</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Crect x='19' y='13' width='26' height='38' rx='3' fill='white'/%3E%3Ccircle cx='39' cy='33' r='2.6' fill='%232563eb'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg:        #f4f6f9;
    --surface:   #ffffff;
    --border:    #e2e6ea;
    --text:      #111827;
    --sub:       #6b7280;
    --ok:        #059669;
    --ok-bg:     #ecfdf5;
    --ok-border: #a7f3d0;
    --alert:     #dc2626;
    --alert-bg:  #fef2f2;
    --alert-bdr: #fecaca;
    --warn:      #d97706;
    --warn-bg:   #fffbeb;
    --warn-bdr:  #fde68a;
    --info:      #2563eb;
    --info-bg:   #eff6ff;
    --info-bdr:  #bfdbfe;
    --early:     #7c3aed;
    --early-bg:  #f5f3ff;
    --early-bdr: #ddd6fe;
    --sev0:      #059669;
    --sev1:      #d97706;
    --sev2:      #ea580c;
    --sev3:      #dc2626;
    --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
    --radius:    10px;
    --font:      'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2d3148;
      --text:      #f1f5f9;
      --sub:       #94a3b8;
      --ok:        #34d399;
      --ok-bg:     #022c22;
      --ok-border: #065f46;
      --alert:     #f87171;
      --alert-bg:  #2d0a0a;
      --alert-bdr: #7f1d1d;
      --warn:      #fbbf24;
      --warn-bg:   #1c1204;
      --warn-bdr:  #78350f;
      --info:      #60a5fa;
      --info-bg:   #0f1e3d;
      --info-bdr:  #1e3a8a;
      --early:     #a78bfa;
      --early-bg:  #1e1435;
      --early-bdr: #5b21b6;
      --sev0:      #34d399;
      --sev1:      #fbbf24;
      --sev2:      #fb923c;
      --sev3:      #f87171;
      --shadow:    0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0f1117; --surface:#1a1d27; --border:#2d3148; --text:#f1f5f9; --sub:#94a3b8;
    --ok:#34d399; --ok-bg:#022c22; --ok-border:#065f46;
    --alert:#f87171; --alert-bg:#2d0a0a; --alert-bdr:#7f1d1d;
    --warn:#fbbf24; --warn-bg:#1c1204; --warn-bdr:#78350f;
    --info:#60a5fa; --info-bg:#0f1e3d; --info-bdr:#1e3a8a;
    --early:#a78bfa; --early-bg:#1e1435; --early-bdr:#5b21b6;
    --sev0:#34d399; --sev1:#fbbf24; --sev2:#fb923c; --sev3:#f87171;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Header ───────────────────────────────── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-logo { font-size: 1.25rem; }
  .header-title { font-weight: 700; font-size: 1rem; }
  .header-sub { font-size: 0.75rem; color: var(--sub); }

  /* ── Timeline de días ─────────────────────── */
  .timeline {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .tl-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tl-bottom { display: flex; align-items: center; gap: 10px; }
  .month-select, .date-jump {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 11px;
    font-family: var(--font);
    font-size: 0.85rem;
    color: var(--text);
    cursor: pointer;
  }
  .date-jump { font-variant-numeric: tabular-nums; }
  .tl-count { font-size: 0.75rem; color: var(--sub); margin-left: auto; }
  .nav-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    font-family: var(--font);
    font-size: 0.85rem;
    padding: 8px 12px;
    transition: background .15s;
    flex-shrink: 0;
  }
  .nav-btn:hover:not(:disabled) { background: var(--border); }
  .nav-btn:disabled { opacity: .35; cursor: default; }
  .days {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px;
    flex: 1;
  }
  .day {
    flex-shrink: 0;
    width: 62px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    cursor: pointer;
    padding: 6px 4px 5px;
    text-align: center;
    font-family: var(--font);
    color: var(--text);
    transition: transform .12s, box-shadow .12s;
  }
  .day:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .day .dow { font-size: 0.62rem; color: var(--sub); text-transform: uppercase; letter-spacing: .06em; }
  .day .dnum { font-size: 1.05rem; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  /* Anillo del día: un segmento por estado, con el número del día al centro.
     Verde = emparejadas, rojo = cierre sin venta (lo que importa), ámbar = venta
     sin cierre, azul = sobrequedada, violeta = salida anticipada. */
  .day .ring { position: relative; width: 44px; height: 44px; margin: 3px auto 0; }
  .day .ring svg { width: 44px; height: 44px; display: block; transform: rotate(-90deg); }
  .day .ring circle { fill: none; stroke-width: 5; }
  .day .ring .track { stroke: var(--border); }
  .day .ring .seg-ok    { stroke: var(--ok); }
  .day .ring .seg-door  { stroke: var(--alert); }
  .day .ring .seg-occ   { stroke: var(--warn); }
  .day .ring .seg-over  { stroke: var(--info); }
  .day .ring .seg-early { stroke: var(--early); }
  .day .ring .dnum {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1;
  }
  .day .cnt {
    font-size: 0.62rem; font-weight: 700; margin-top: 4px;
    display: flex; justify-content: center; gap: 3px;
    font-variant-numeric: tabular-nums;
  }
  .day .cnt .good { color: var(--ok); }
  .day .cnt .door { color: var(--sub); }
  .day .cnt .door.hay { color: var(--alert); }
  .day .cnt .sep  { color: var(--border); font-weight: 400; }
  .day.active { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .day.empty { opacity: .35; cursor: default; }
  .day.empty:hover { transform: none; box-shadow: none; }
  .tl-legend {
    display: flex; flex-wrap: wrap; gap: 4px 12px;
    font-size: 0.68rem; color: var(--sub); padding-left: 2px;
  }
  .tl-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .tl-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .tl-legend .l-ok    { background: var(--ok); }
  .tl-legend .l-door  { background: var(--alert); }
  .tl-legend .l-occ   { background: var(--warn); }
  .tl-legend .l-over  { background: var(--info); }
  .tl-legend .l-early { background: var(--early); }

  /* ── Main ─────────────────────────────────── */
  .main { max-width: 1100px; margin: 0 auto; padding: 24px; }

  .stale {
    max-width: 1100px;
    margin: 20px auto -4px;
    padding: 12px 18px;
    border-radius: var(--radius);
    background: var(--warn-bg);
    border: 1px solid var(--warn-bdr);
    color: var(--warn);
    font-size: 0.86rem;
    font-weight: 500;
  }
  .stale strong { font-weight: 700; }
  @media (max-width: 640px) { .stale { margin: 14px 14px -4px; } }

  .date-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
  .date-sub {
    font-size: 0.78rem; color: var(--sub); margin-bottom: 18px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .prov {
    font-size: 0.7rem; font-weight: 600; padding: 2px 8px;
    border-radius: 20px; border: 1px solid;
    background: var(--warn-bg); color: var(--warn); border-color: var(--warn-bdr);
  }
  .prov.firme { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }

  .status-bar {
    padding: 12px 18px;
    border-radius: var(--radius);
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 20px;
    border: 1px solid;
  }
  .status-ok    { background: var(--ok-bg);    color: var(--ok);    border-color: var(--ok-border); }
  .status-alert { background: var(--alert-bg); color: var(--alert); border-color: var(--alert-bdr); }

  /* ── Filtros ──────────────────────────────── */
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 18px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 13px;
    font-family: var(--font);
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { border-color: var(--sub); }
  .chip .n {
    font-size: 0.72rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    opacity: .75;
  }
  .chip.on { border-width: 1.5px; font-weight: 600; }
  .chip.on.f-all   { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip.on.f-ok    { background: var(--ok-bg);    color: var(--ok);    border-color: var(--ok-border); }
  .chip.on.f-door  { background: var(--alert-bg); color: var(--alert); border-color: var(--alert-bdr); }
  .chip.on.f-occ   { background: var(--warn-bg);  color: var(--warn);  border-color: var(--warn-bdr); }
  .chip.on.f-co    { background: var(--info-bg);  color: var(--info);  border-color: var(--info-bdr); }
  .chip.on.f-early { background: var(--early-bg); color: var(--early); border-color: var(--early-bdr); }
  .chip:disabled { opacity: .4; cursor: default; }

  .room-select {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 12px;
    font-family: var(--font);
    font-size: 0.8rem;
    color: var(--text);
    cursor: pointer;
  }
  .room-select:focus-visible, .chip:focus-visible, .nav-btn:focus-visible, .day:focus-visible {
    outline: 2px solid var(--info);
    outline-offset: 2px;
  }

  /* ── Cards ────────────────────────────────── */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow);
  }
  .card .num  { font-size: 2.2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .card .lbl  { font-size: 0.75rem; color: var(--sub); margin-top: 4px; font-weight: 500; }
  .card.c-ok    .num { color: var(--ok); }
  .card.c-alert .num { color: var(--alert); }
  .card.c-warn  .num { color: var(--warn); }
  .card.c-info  .num { color: var(--info); }

  /* ── Tabla ────────────────────────────────── */
  .table-wrap { overflow-x: auto; border-radius: var(--radius); box-shadow: var(--shadow); }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    font-variant-numeric: tabular-nums;
  }
  thead { background: var(--bg); }
  th {
    padding: 10px 14px;
    text-align: left;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: .05em;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 10px 14px;
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    vertical-align: middle;
    white-space: nowrap;
  }
  tr.r-ok   { background: var(--surface); }
  tr.r-door { background: var(--alert-bg); }
  tr.r-occ  { background: var(--warn-bg); }
  tr.r-co    { background: var(--info-bg); }
  tr.r-early { background: var(--early-bg); }
  tr:hover td { filter: brightness(.97); }

  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
    border: 1px solid;
  }
  .b-ok    { background: var(--ok-bg);    color: var(--ok);    border-color: var(--ok-border); }
  .b-alert { background: var(--alert-bg); color: var(--alert); border-color: var(--alert-bdr); }
  .b-warn  { background: var(--warn-bg);  color: var(--warn);  border-color: var(--warn-bdr); }
  .b-info  { background: var(--info-bg);  color: var(--info);  border-color: var(--info-bdr); }
  .b-early { background: var(--early-bg); color: var(--early); border-color: var(--early-bdr); }
  .card.c-early .num { color: var(--early); }

  .alert-msg { color: var(--sub); font-style: italic; font-size: 0.82rem; }
  .diff-ok   { color: var(--sub); }
  .diff-bad  { color: var(--warn); font-weight: 600; }
  .long      { font-weight: 600; }

  .placeholder {
    text-align: center;
    padding: 60px 20px;
    color: var(--sub);
    font-size: 0.95rem;
  }
  .placeholder .icon { font-size: 2.5rem; margin-bottom: 12px; }

  .legend {
    margin-top: 20px;
    font-size: 0.78rem;
    color: var(--sub);
    line-height: 2;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 20px;
  }

  @media (max-width: 640px) {
    .header { padding: 0 14px; }
    .timeline { padding: 10px 14px; gap: 8px; }
    .main { padding: 14px; }
    .room-select { margin-left: 0; width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .day:hover { transform: none; }
  }

  /* ── Pestañas de motel ────────────────────── */
  .tabs {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    gap: 2px;
    overflow-x: auto;
    position: sticky;
    top: 56px;
    z-index: 99;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    appearance: none;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--sub);
    font: inherit;
    font-weight: 600;
    font-size: .875rem;
    padding: 11px 14px 9px;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: color .12s, border-color .12s;
  }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--info); border-bottom-color: var(--info); }
  .tab .pill {
    font-size: .6875rem;
    font-weight: 700;
    min-width: 18px;
    padding: 1px 5px;
    border-radius: 9px;
    background: var(--border);
    color: var(--sub);
  }
  .tab .pill.mal  { background: var(--alert); color: #fff; }   /* hay cierres sin venta */
  .tab .pill.ojo  { background: var(--warn);  color: #fff; }   /* solo otros tipos */
  .tab .pill.bien { background: var(--ok);    color: #fff; }

  /* ── Vista resumen ────────────────────────── */
  .resumen {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .mcard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left-width: 3px;
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .mcard.mal   { border-left-color: var(--alert); }   /* hay cierres sin venta */
  .mcard.ojo   { border-left-color: var(--warn); }    /* solo otros tipos */
  .mcard.bien  { border-left-color: var(--ok); }
  .mcard.vacio { border-left-color: var(--border); opacity: .72; }
  .mcard-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .mcard-nombre { font-weight: 700; font-size: .9375rem; }
  .mcard-dir { font-size: .75rem; color: var(--sub); }
  .mcard-big { font-size: 1.75rem; font-weight: 700; line-height: 1; }
  .mcard-big.mal  { color: var(--alert); }
  .mcard-big.ojo  { color: var(--warn); }
  .mcard-big.bien { color: var(--ok); }
  .mcard-desglose { display: flex; flex-wrap: wrap; gap: 5px; }
  .mini {
    font-size: .6875rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--sub);
    white-space: nowrap;
  }
  .mini.m-ok    { background: var(--ok-bg);    border-color: var(--ok-border); color: var(--ok); }
  .mini.m-door  { background: var(--alert-bg); border-color: var(--alert-bdr); color: var(--alert); }
  .mini.m-occ   { background: var(--warn-bg);  border-color: var(--warn-bdr);  color: var(--warn); }
  .mini.m-over  { background: var(--info-bg);  border-color: var(--info-bdr);  color: var(--info); }
  .mini.m-early { background: var(--early-bg); border-color: var(--early-bdr); color: var(--early); }
  .mcard-link {
    appearance: none;
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font: inherit;
    font-size: .8125rem;
    font-weight: 600;
    padding: 6px 10px;
    cursor: pointer;
    align-self: flex-start;
  }
  .mcard-link:hover { border-color: var(--info); color: var(--info); }
  .mcard-link:disabled { opacity: .45; cursor: default; }

  .alist-h {
    font-weight: 700;
    font-size: .9375rem;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .alist-h .cuenta { font-size: .8125rem; font-weight: 600; color: var(--sub); }
  .amotel { margin-bottom: 16px; }
  .amotel-h {
    font-size: .75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--sub);
    padding: 0 0 6px 2px;
  }
  .arow {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    margin-bottom: 5px;
    font-size: .8125rem;
  }
  .arow .hab { font-weight: 700; min-width: 62px; }
  .arow .det { color: var(--sub); }
  .arow .det strong { color: var(--text); font-weight: 600; }

  @media (max-width: 640px) {
    .tabs { padding: 0 16px; }
    .tab { padding: 10px 11px 8px; font-size: .8125rem; }
    .resumen { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <span class="header-logo">🚪</span>
    <div>
      <div class="header-title">Motel Door Checker</div>
      <div class="header-sub" id="headerSub">Grupo Now</div>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<nav class="timeline">
  <div class="tl-top">
    <select class="month-select" id="monthSel" aria-label="Mes"></select>
    <input type="date" class="date-jump" id="dateJump" aria-label="Ir a una fecha">
    <span class="tl-count" id="tlCount"></span>
  </div>
  <div class="tl-bottom">
    <button class="nav-btn" id="btnPrev" title="Día anterior">◀</button>
    <div class="days" id="days"></div>
    <button class="nav-btn" id="btnNext" title="Día siguiente">▶</button>
  </div>
  <div class="tl-legend">
    <span><i class="l-ok"></i>Emparejadas</span>
    <span><i class="l-door"></i>Cierre sin venta</span>
    <span><i class="l-occ"></i>Venta sin cierre</span>
    <span><i class="l-over"></i>Sobrequedada</span>
    <span><i class="l-early"></i>Salida anticipada</span>
    <span>· Debajo de cada día: emparejadas · cierres sin venta</span>
  </div>
</nav>

<div id="staleBar" hidden></div>

<main class="main" id="main">
  <div class="placeholder"><div class="icon">⏳</div>Cargando datos…</div>
</main>

<script>
// ─────────────────────────────────────────────────────────────
//  Estado
// ─────────────────────────────────────────────────────────────
let MOTELES = [];        // [{slug, nombre, direccion, motel_id, ...}] de moteles.json
const M = {};            // slug -> {dates, dateSet, stats, cache}
let vista = 'resumen';   // 'resumen' | slug de motel
let unionDates = [];     // todas las fechas de todos los moteles, desc
let statsUnion = {};     // fecha -> suma de los conteos de los tres moteles

// Punteros a los datos de la vista activa. Cambian con la pestaña.
let dates = [];          // más reciente primero
let dateSet = new Set();
let stats = {};          // date -> {ok, door, over, early, occ}  (viene de index.json)
let cache = {};          // date -> reporte completo
let currentIdx = 0;
let currentDate = '';    // fecha activa; se conserva al cambiar de motel
let currentMonth = '';   // 'YYYY-MM'
let filterStatus = 'all';
let filterRoom = 'all';

function motelDe(slug) { return MOTELES.find(m => m.slug === slug); }

// Apunta dates/dateSet/stats/cache a la vista pedida.
function aplicarVista(slug) {
  vista = slug;
  if (slug === 'resumen') {
    dates = unionDates;
    dateSet = new Set(unionDates);
    stats = statsUnion;
    cache = {};                    // el resumen lee el caché de cada motel
  } else {
    const st = M[slug];
    dates = st.dates; dateSet = st.dateSet; stats = st.stats; cache = st.cache;
  }
}

function malDe(s) { return s ? s.door + s.over + s.early + s.occ : 0; }

const MESES = ['enero','febrero','marzo','abril','mayo','junio',
               'julio','agosto','septiembre','octubre','noviembre','diciembre'];

const STATUSES = [
  { key: 'ok',        cls: 'f-ok',    label: '✅ Emparejadas',       card: 'Emparejadas ✅',       cardCls: 'c-ok',    rowCls: 'r-ok',    badge: '<span class="badge b-ok">✅ OK</span>' },
  { key: 'door_only', cls: 'f-door',  label: '🚨 Cierre sin venta',  card: 'Cierre sin venta 🚨',  cardCls: 'c-alert', rowCls: 'r-door',  badge: '<span class="badge b-alert">🚨 Sin venta</span>' },
  { key: 'over',      cls: 'f-co',    label: '🟡 Sobrequedadas',     card: 'Sobrequedadas 🟡',     cardCls: 'c-info',  rowCls: 'r-co',    badge: '<span class="badge b-info">🟡 Sobrequedada</span>' },
  { key: 'early',     cls: 'f-early', label: '🟣 Salidas anticipadas', card: 'Salida anticipada 🟣', cardCls: 'c-early', rowCls: 'r-early', badge: '<span class="badge b-early">🟣 Salida anticipada</span>' },
  { key: 'occ_only',  cls: 'f-occ',   label: '⚠️ Venta sin cierre',  card: 'Venta sin cierre ⚠️',  cardCls: 'c-warn',  rowCls: 'r-occ',   badge: '<span class="badge b-warn">⚠️ Sin cierre</span>' },
];
const BY_KEY = Object.fromEntries(STATUSES.map(s => [s.key, s]));

// Una fila co_alert se separa según el signo de CO Δ:
//   co_diff > 0 → la puerta se abrió DESPUÉS del check-out del PMS  → sobrequedada
//   co_diff < 0 → la puerta se abrió ANTES del check-out del PMS    → salida anticipada
function kindOf(row) {
  if (row.status !== 'co_alert') return row.status;
  return (row.co_diff != null && row.co_diff > 0) ? 'over' : 'early';
}

// ─────────────────────────────────────────────────────────────
//  Utilidades
// ─────────────────────────────────────────────────────────────
function fmtDur(min) {
  if (min == null) return '—';
  const m = Math.round(min);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60);
  const r = m % 60;
  return r === 0 ? `${h} h` : `${h} h ${r} min`;
}

function fmtDateLong(ds) {
  const [y, m, d] = ds.split('-').map(Number);
  const days = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const months = ['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const dt = new Date(y, m - 1, d);
  const name = days[dt.getDay()];
  return `${name.charAt(0).toUpperCase() + name.slice(1)} ${d} de ${months[m]}, ${y}`;
}

function dowShort(ds) {
  const [y, m, d] = ds.split('-').map(Number);
  return ['dom','lun','mar','mié','jue','vie','sáb'][new Date(y, m - 1, d).getDay()];
}

function countByStatus(data) {
  const c = { ok: 0, door_only: 0, occ_only: 0, over: 0, early: 0 };
  (data.rows || []).forEach(r => { const k = kindOf(r); if (k in c) c[k]++; });
  c.all = (data.rows || []).length;
  return c;
}

// Anillo de un día: un segmento por estado, proporcional a su cantidad.
// Orden fijo (ok → sin venta → sin cierre → sobrequedada → anticipada) para que
// el rojo quede siempre a continuación del verde y sea fácil de comparar entre días.
const RING_SEGS = [
  { key: 'ok',    cls: 'seg-ok' },
  { key: 'door',  cls: 'seg-door' },
  { key: 'occ',   cls: 'seg-occ' },
  { key: 'over',  cls: 'seg-over' },
  { key: 'early', cls: 'seg-early' },
];
function ringHtml(s, dayNum) {
  const total = s ? RING_SEGS.reduce((a, g) => a + (s[g.key] || 0), 0) : 0;
  let segs = '';
  if (total > 0) {
    let offset = 0;
    for (const g of RING_SEGS) {
      const n = s[g.key] || 0;
      if (!n) continue;
      const len = (n / total) * 100;
      // pathLength=100 → dasharray en porcentajes; el offset negativo empuja el segmento
      segs += `<circle class="${g.cls}" cx="22" cy="22" r="17.5" pathLength="100"
                 stroke-dasharray="${len.toFixed(2)} ${(100 - len).toFixed(2)}"
                 stroke-dashoffset="${(-offset).toFixed(2)}"></circle>`;
      offset += len;
    }
  }
  return `<div class="ring">
    <svg viewBox="0 0 44 44" aria-hidden="true">
      <circle class="track" cx="22" cy="22" r="17.5"></circle>${segs}
    </svg>
    <div class="dnum">${dayNum}</div>
  </div>`;
}

// Conteos de un día: primero del índice, si no del reporte ya cargado.
function statsOf(date) {
  if (stats[date]) return stats[date];
  if (cache[date]) {
    const c = countByStatus(cache[date]);
    stats[date] = { ok: c.ok, door: c.door_only, over: c.over, early: c.early, occ: c.occ_only };
    return stats[date];
  }
  return null;
}

function roomKey(r) {
  const n = parseInt(r, 10);
  return isNaN(n) ? [9999, r] : [n, r];
}

// ─────────────────────────────────────────────────────────────
//  Arranque: precarga todos los días para el semáforo
// ─────────────────────────────────────────────────────────────
async function init() {
  let meta;
  try {
    const res = await fetch('data/moteles.json?t=' + Date.now());
    if (!res.ok) throw new Error();
    meta = await res.json();
  } catch (e) {
    document.getElementById('main').innerHTML =
      '<div class="placeholder"><div class="icon">⚠️</div>No se encontraron datos publicados.</div>';
    return;
  }

  MOTELES = meta.moteles || [];

  // Un índice por motel, en paralelo
  await Promise.all(MOTELES.map(async m => {
    M[m.slug] = { dates: [], dateSet: new Set(), stats: {}, cache: {} };
    try {
      const r = await fetch(`data/${m.slug}/index.json?t=` + Date.now());
      if (!r.ok) return;
      const idx = await r.json();
      const ds = (idx.dates || []).slice().sort().reverse();
      M[m.slug] = { dates: ds, dateSet: new Set(ds), stats: idx.stats || {}, cache: {} };
    } catch (e) { /* motel sin datos todavía */ }
  }));

  // Unión de fechas y conteos sumados, para la vista de resumen
  const todas = new Set();
  MOTELES.forEach(m => M[m.slug].dates.forEach(d => todas.add(d)));
  unionDates = [...todas].sort().reverse();
  statsUnion = {};
  unionDates.forEach(d => {
    const t = { ok: 0, door: 0, over: 0, early: 0, occ: 0 };
    MOTELES.forEach(m => {
      const s = M[m.slug].stats[d];
      if (s) { t.ok += s.ok; t.door += s.door; t.over += s.over; t.early += s.early; t.occ += s.occ; }
    });
    statsUnion[d] = t;
  });

  if (!unionDates.length) {
    renderTabs();
    document.getElementById('main').innerHTML =
      '<div class="placeholder"><div class="icon">📭</div>No hay reportes disponibles.</div>';
    return;
  }

  aplicarVista(MOTELES.length > 1 ? 'resumen' : (MOTELES[0] && MOTELES[0].slug) || 'resumen');
  actualizarRango();
  buildMonthSelect();
  avisarSiEstaAtrasado();
  show(0);
}

function actualizarRango() {
  const jump = document.getElementById('dateJump');
  jump.min = dates[dates.length - 1];
  jump.max = dates[0];
  document.getElementById('tlCount').textContent =
    `${dates.length} día${dates.length === 1 ? '' : 's'} publicados`;
  const m = motelDe(vista);
  document.getElementById('headerSub').textContent =
    m ? `${m.nombre} · ${m.motel_id}` : `${MOTELES.length} moteles`;
}

// ─────────────────────────────────────────────────────────────
//  Pestañas
// ─────────────────────────────────────────────────────────────
function renderTabs() {
  const el = document.getElementById('tabs');
  const items = [{ slug: 'resumen', nombre: 'Resumen' }, ...MOTELES];
  el.innerHTML = items.map(m => {
    const s = m.slug === 'resumen' ? statsUnion[currentDate] : (M[m.slug] || {}).stats?.[currentDate];
    const hay = !!s;
    const mal = malDe(s);
    // Rojo solo cuando hay cierres sin venta; el resto de inconsistencias va en ámbar.
    const tono = !mal ? 'bien' : (s.door > 0 ? 'mal' : 'ojo');
    const pill = hay
      ? `<span class="pill ${tono}">${mal}</span>`
      : `<span class="pill">–</span>`;
    return `<button class="tab ${vista === m.slug ? 'on' : ''}" data-slug="${m.slug}"
              title="${hay ? mal + ' inconsistencia(s) el ' + currentDate : 'Sin reporte el ' + currentDate}">${m.nombre}${pill}</button>`;
  }).join('');
  el.querySelectorAll('.tab').forEach(b =>
    b.addEventListener('click', () => cambiarVista(b.dataset.slug)));
}

function cambiarVista(slug) {
  if (slug === vista) return;
  const antes = currentDate;
  aplicarVista(slug);

  if (!dates.length) {
    currentDate = antes;
    renderTabs();
    actualizarRango();
    document.getElementById('main').innerHTML =
      `<div class="placeholder"><div class="icon">📭</div>${(motelDe(slug) || {}).nombre || slug} todavía no tiene reportes publicados.</div>`;
    return;
  }

  // conservar el día; si ese motel no lo tiene, el publicado más cercano hacia atrás
  let i = dates.indexOf(antes);
  if (i < 0) {
    const anterior = dates.find(d => d <= antes);
    i = anterior ? dates.indexOf(anterior) : 0;
  }
  actualizarRango();
  buildMonthSelect();
  show(i);
}

async function cargarDia(slug, date) {
  if (M[slug].cache[date]) return true;
  try {
    const r = await fetch(`data/${slug}/${date}.json?t=` + Date.now());
    if (!r.ok) throw new Error();
    M[slug].cache[date] = await r.json();
    return true;
  } catch (e) { return false; }
}

// El reporte de un día se genera al día siguiente. Si el más reciente
// es más viejo que ayer, algo falló en la publicación automática.
function avisarSiEstaAtrasado() {
  const hoy = new Date();
  const ayer = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - 1);
  const ayerStr = `${ayer.getFullYear()}-${String(ayer.getMonth() + 1).padStart(2, '0')}-${String(ayer.getDate()).padStart(2, '0')}`;
  const bar = document.getElementById('staleBar');
  const atrasados = MOTELES.filter(m => {
    const u = M[m.slug].dates[0];
    return !u || u < ayerStr;
  });
  if (!atrasados.length) { bar.hidden = true; return; }

  const txt = atrasados.map(m => {
    const u = M[m.slug].dates[0];
    if (!u) return `<strong>${m.nombre}</strong> (sin reportes)`;
    const faltan = Math.round((ayer - new Date(u + 'T00:00:00')) / 86400000);
    return `<strong>${m.nombre}</strong> (último ${u}, faltan ${faltan})`;
  }).join(' · ');

  bar.className = 'stale';
  bar.innerHTML = `⏳ Publicación atrasada: ${txt} — revisa que el Mac haya corrido la publicación autom&aacute;tica.`;
  bar.hidden = false;
}

// La copia del PMS se toma ~7:00 AM: un reporte generado al día siguiente
// puede traer check-outs provisorios de 12:00. Recién al segundo día la
// copia trae los cierres definitivos.
function sello(fecha, generated) {
  if (!generated) return '';
  const gen = generated.slice(0, 10);
  const limite = new Date(fecha + 'T00:00:00');
  limite.setDate(limite.getDate() + 2);
  const limiteStr = `${limite.getFullYear()}-${String(limite.getMonth() + 1).padStart(2, '0')}-${String(limite.getDate()).padStart(2, '0')}`;

  return gen >= limiteStr
    ? '<span class="prov firme" title="El PMS ya tenía los check-out definitivos cuando se generó este reporte">✔ Datos confirmados</span>'
    : '<span class="prov" title="Generado con la copia del PMS del día siguiente: las estadías aún abiertas pueden mostrar check-out provisorio de 12:00. Se re-verifica solo al día siguiente.">Provisorio</span>';
}

function buildMonthSelect() {
  const meses = [...new Set(dates.map(d => d.slice(0, 7)))];  // ya vienen desc
  const sel = document.getElementById('monthSel');
  sel.innerHTML = meses.map(m => {
    const [y, mm] = m.split('-');
    const n = dates.filter(d => d.startsWith(m)).length;
    return `<option value="${m}">${MESES[+mm - 1]} ${y} (${n})</option>`;
  }).join('');
  sel.value = currentMonth || (dates[currentIdx] || dates[0]).slice(0, 7);
  sel.onchange = () => {
    // al cambiar de mes, ir al día más reciente publicado de ese mes
    const primero = dates.find(d => d.startsWith(sel.value));
    if (primero) show(dates.indexOf(primero));
  };
}

// Si el índice no trae stats (versión antigua), se descargan los días
// del mes en paralelo y se repinta la tira.
async function ensureMonthStats(month) {
  if (vista === 'resumen') return;   // el resumen se arma con los índices ya cargados
  const faltan = dates.filter(d => d.startsWith(month) && !statsOf(d));
  if (!faltan.length) return;
  const slug = vista;
  await Promise.all(faltan.map(async d => {
    try {
      const r = await fetch(`data/${slug}/${d}.json?t=` + Date.now());
      if (r.ok) { cache[d] = await r.json(); statsOf(d); }
    } catch (e) { /* ignorar */ }
  }));
  if (currentMonth === month && vista === slug) renderDays();
}

function renderDays() {
  const el = document.getElementById('days');
  const [y, m] = currentMonth.split('-').map(Number);
  const diasDelMes = new Date(y, m, 0).getDate();
  const activo = dates[currentIdx];
  el.innerHTML = '';

  for (let d = 1; d <= diasDelMes; d++) {
    const ds = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const btn = document.createElement('button');
    btn.dataset.date = ds;

    if (!dateSet.has(ds)) {
      btn.className = 'day empty';
      btn.disabled = true;
      btn.title = `${fmtDateLong(ds)} — sin reporte`;
      btn.innerHTML = `
        <div class="dow">${dowShort(ds)}</div>
        ${ringHtml(null, d)}
        <div class="cnt">—</div>`;
      el.appendChild(btn);
      continue;
    }

    const s = statsOf(ds);
    if (!s) {
      btn.className = 'day';
      btn.innerHTML = `
        <div class="dow">${dowShort(ds)}</div>
        ${ringHtml(null, d)}
        <div class="cnt">…</div>`;
    } else {
      const mal = s.door + s.over + s.early + s.occ;
      btn.className = 'day';
      btn.title = `${fmtDateLong(ds)} — ${s.ok} OK · ${s.door} cierre${s.door === 1 ? '' : 's'} sin venta`
        + ` · ${s.occ} venta${s.occ === 1 ? '' : 's'} sin cierre · ${s.over} sobrequedada${s.over === 1 ? '' : 's'}`
        + ` · ${s.early} salida${s.early === 1 ? '' : 's'} anticipada${s.early === 1 ? '' : 's'}`
        + ` (${mal} inconsistencia${mal === 1 ? '' : 's'})`;
      btn.innerHTML = `
        <div class="dow">${dowShort(ds)}</div>
        ${ringHtml(s, d)}
        <div class="cnt"><span class="good">${s.ok}</span><span class="sep">·</span><span class="door ${s.door ? 'hay' : ''}">${s.door}</span></div>`;
    }

    if (ds === activo) btn.classList.add('active');
    btn.addEventListener('click', () => show(dates.indexOf(ds)));
    el.appendChild(btn);
  }

  const act = el.querySelector('.day.active');
  if (act) act.scrollIntoView({ block: 'nearest', inline: 'center' });
}

async function show(i) {
  currentIdx = i;
  const date = dates[i];
  currentDate = date;
  currentMonth = date.slice(0, 7);

  document.getElementById('monthSel').value = currentMonth;
  document.getElementById('dateJump').value = date;
  document.getElementById('btnPrev').disabled = i >= dates.length - 1;
  document.getElementById('btnNext').disabled = i <= 0;

  renderTabs();
  renderDays();
  ensureMonthStats(currentMonth);

  filterStatus = 'all';
  filterRoom = 'all';

  const main = document.getElementById('main');

  if (vista === 'resumen') {
    const faltan = MOTELES.filter(m => M[m.slug].dateSet.has(date) && !M[m.slug].cache[date]);
    if (faltan.length) {
      main.innerHTML = '<div class="placeholder"><div class="icon">⏳</div>Cargando los tres moteles…</div>';
      await Promise.all(faltan.map(m => cargarDia(m.slug, date)));
    }
    if (currentDate !== date) return;   // el usuario ya cambió de día
    renderResumen();
    return;
  }

  if (!cache[date]) {
    main.innerHTML = '<div class="placeholder"><div class="icon">⏳</div>Cargando reporte…</div>';
    const ok = await cargarDia(vista, date);
    if (!ok) {
      main.innerHTML =
        `<div class="placeholder"><div class="icon">📭</div>No se pudo cargar el reporte de ${date}</div>`;
      return;
    }
  }
  if (currentDate !== date) return;  // el usuario ya cambió de día
  render();
}

// ─────────────────────────────────────────────────────────────
//  Render
// ─────────────────────────────────────────────────────────────
function render() {
  if (vista === 'resumen') return renderResumen();
  return renderMotel();
}

// ─────────────────────────────────────────────────────────────
//  Resumen de los tres moteles para un día
// ─────────────────────────────────────────────────────────────
const MINIS = [
  { key: 'ok',        cls: 'm-ok',    txt: 'OK' },
  { key: 'door_only', cls: 'm-door',  txt: 'sin venta' },
  { key: 'occ_only',  cls: 'm-occ',   txt: 'sin cierre' },
  { key: 'over',      cls: 'm-over',  txt: 'sobrequedada' },
  { key: 'early',     cls: 'm-early', txt: 'salida antic.' },
];

// Detalle legible de una fila con problema, para la lista del resumen.
function detalleAlerta(row) {
  const k = kindOf(row);
  const puerta = row.door_start ? `${row.door_start} – ${row.door_end || '—'}` : '—';
  const venta  = row.occ_start  ? `${row.occ_start} – ${row.occ_end || '—'}`   : '—';
  if (k === 'door_only')
    return `Puerta cerrada <strong>${puerta}</strong> (${fmtDur(row.duration_min)}) sin venta registrada`;
  if (k === 'occ_only')
    return `Venta <strong>${venta}</strong> sin cierre de puerta detectado`;
  if (k === 'over')
    return `Puerta abierta <strong>${Math.round(row.co_diff)} min después</strong> del check-out · venta ${venta}`;
  if (k === 'early')
    return `Puerta abierta <strong>${Math.abs(Math.round(row.co_diff))} min antes</strong> del check-out · venta ${venta}`;
  return `Puerta ${puerta} · venta ${venta}`;
}

function renderResumen() {
  const date = currentDate;

  const porMotel = MOTELES.map(m => {
    const data = M[m.slug].cache[date];
    const s    = M[m.slug].stats[date];
    if (!data && !s) return { m, hay: false };
    const c = data ? countByStatus(data)
                   : { ok: s.ok, door_only: s.door, occ_only: s.occ, over: s.over,
                       early: s.early, all: s.ok + s.door + s.occ + s.over + s.early };
    return {
      m, hay: true, data, c,
      mal: c.door_only + c.occ_only + c.over + c.early,
      filas: data ? (data.rows || []).filter(r => kindOf(r) !== 'ok') : [],
    };
  });

  const totalMal = porMotel.reduce((a, x) => a + (x.mal || 0), 0);
  const totalOk  = porMotel.reduce((a, x) => a + ((x.c && x.c.ok) || 0), 0);
  const sinDatos = porMotel.filter(x => !x.hay).map(x => x.m.nombre);

  const statusHtml = totalMal > 0
    ? `<div class="status-bar status-alert">🔴 ${totalMal} inconsistencia${totalMal > 1 ? 's' : ''} en total — revisar</div>`
    : `<div class="status-bar status-ok">✅ Sin inconsistencias en ningún motel — todo cuadra</div>`;

  const tarjetas = porMotel.map(x => {
    const m = x.m;
    if (!x.hay) {
      return `<div class="mcard vacio">
        <div class="mcard-top">
          <div><div class="mcard-nombre">${m.nombre}</div>
               <div class="mcard-dir">${m.direccion || ''}</div></div>
          <div class="mcard-big">–</div>
        </div>
        <div class="mcard-desglose"><span class="mini">Sin reporte este día</span></div>
        <button class="mcard-link" disabled>Ver detalle →</button>
      </div>`;
    }
    const cls = !x.mal ? 'bien' : (x.c.door_only > 0 ? 'mal' : 'ojo');
    const minis = MINIS
      .filter(mi => mi.key === 'ok' || x.c[mi.key] > 0)
      .map(mi => `<span class="mini ${mi.cls}">${x.c[mi.key]} ${mi.txt}</span>`).join('');
    const prov = x.data ? sello(date, x.data.generated) : '';
    return `<div class="mcard ${cls}">
      <div class="mcard-top">
        <div><div class="mcard-nombre">${m.nombre}</div>
             <div class="mcard-dir">${m.direccion || ''} · PMS ${m.motel_id}</div></div>
        <div class="mcard-big ${cls}">${x.mal}</div>
      </div>
      <div class="mcard-desglose">${minis}${prov}</div>
      <button class="mcard-link" data-ir="${m.slug}">Ver detalle →</button>
    </div>`;
  }).join('');

  const listas = porMotel.filter(x => x.hay && x.filas.length).map(x => `
    <div class="amotel">
      <div class="amotel-h">${x.m.nombre} — ${x.filas.length} inconsistencia${x.filas.length > 1 ? 's' : ''}</div>
      ${x.filas.map(r => {
        const st = BY_KEY[kindOf(r)];
        return `<div class="arow">
          <span class="hab">${r.room}</span>
          ${st ? st.badge : ''}
          <span class="det">${detalleAlerta(r)}</span>
        </div>`;
      }).join('')}
    </div>`).join('');

  const cuerpoAlertas = totalMal > 0
    ? `<div class="alist-h">Qué revisar <span class="cuenta">${totalOk} estadías cuadran</span></div>${listas}`
    : '';

  const avisoSinDatos = sinDatos.length
    ? `<div class="date-sub" style="margin-bottom:14px">Sin reporte este día: ${sinDatos.join(', ')}</div>`
    : '';

  document.getElementById('main').innerHTML = `
    <div class="date-title">${fmtDateLong(date)}</div>
    <div class="date-sub"><span>Los tres moteles</span></div>
    ${statusHtml}
    <div class="resumen">${tarjetas}</div>
    ${avisoSinDatos}
    ${cuerpoAlertas}`;

  document.querySelectorAll('.mcard-link[data-ir]').forEach(b =>
    b.addEventListener('click', () => cambiarVista(b.dataset.ir)));
}

// ─────────────────────────────────────────────────────────────
//  Detalle de un motel
// ─────────────────────────────────────────────────────────────
function renderMotel() {
  const date = dates[currentIdx];
  const data = cache[date];
  const rows = data.rows || [];
  const counts = countByStatus(data);
  const alerts = counts.door_only + counts.occ_only + counts.over + counts.early;

  const rooms = [...new Set(rows.map(r => r.room))]
    .sort((a, b) => { const ka = roomKey(a), kb = roomKey(b); return ka[0] - kb[0] || String(ka[1]).localeCompare(String(kb[1])); });

  const statusHtml = alerts > 0
    ? `<div class="status-bar status-alert">🔴 ${alerts} inconsistencia${alerts > 1 ? 's' : ''} — revisar</div>`
    : `<div class="status-bar status-ok">✅ Sin inconsistencias — todo cuadra</div>`;

  const chips = [
    `<button class="chip f-all ${filterStatus === 'all' ? 'on' : ''}" data-f="all">Todas <span class="n">${counts.all}</span></button>`,
    ...STATUSES.map(st =>
      `<button class="chip ${st.cls} ${filterStatus === st.key ? 'on' : ''}" data-f="${st.key}" ${counts[st.key] === 0 ? 'disabled' : ''}>${st.label} <span class="n">${counts[st.key]}</span></button>`)
  ].join('');

  const roomOpts = ['<option value="all">Todas las habitaciones</option>',
    ...rooms.map(r => `<option value="${r}" ${filterRoom === r ? 'selected' : ''}>${r}</option>`)].join('');

  const visible = rows.filter(r =>
    (filterStatus === 'all' || kindOf(r) === filterStatus) &&
    (filterRoom === 'all' || r.room === filterRoom));

  document.getElementById('main').innerHTML = `
    <div class="date-title">${fmtDateLong(date)}</div>
    <div class="date-sub"><span>Generado ${data.generated || '—'}</span>${sello(date, data.generated)}</div>
    ${statusHtml}
    <div class="cards">
      ${STATUSES.map(st => `<div class="card ${st.cardCls}"><div class="num">${counts[st.key]}</div><div class="lbl">${st.card}</div></div>`).join('')}
    </div>
    <div class="filters">
      ${chips}
      <select class="room-select" id="roomSel">${roomOpts}</select>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Habitación</th><th>Estado</th><th>Puerta cerrada</th><th>Duración</th>
        <th>Venta (PMS)</th><th>Pago</th><th>CI Δ / CO Δ</th>
      </tr></thead>
      <tbody>${visible.length ? visible.map(renderRow).join('') :
        '<tr><td colspan="7" class="placeholder" style="padding:36px">Ningún registro con estos filtros</td></tr>'}</tbody>
    </table></div>
    <div class="legend">
      <span>✅ <strong>Emparejada</strong>: cierre ≥15 min coincide con venta (±30 min)</span>
      <span>🚨 <strong>Cierre sin venta</strong>: puerta cerrada ≥15 min sin registro en PMS</span>
      <span>🟡 <strong>Sobrequedada</strong>: la puerta se abrió mucho después del check-out del PMS — posible tiempo extra no cobrado</span>
      <span>🟣 <strong>Salida anticipada</strong>: la puerta se abrió mucho antes del check-out del PMS — la habitación quedó libre dentro de la ventana pagada</span>
      <span>⚠️ <strong>Venta sin cierre</strong>: venta en PMS sin cierre de puerta detectado</span>
    </div>`;

  document.querySelectorAll('.chip').forEach(c =>
    c.addEventListener('click', () => { filterStatus = c.dataset.f; render(); }));
  document.getElementById('roomSel').addEventListener('change', e => {
    filterRoom = e.target.value; render();
  });
}

function renderRow(row) {
  const st = BY_KEY[kindOf(row)];
  const rowCls = st ? st.rowCls : 'r-ok';
  const badge = st ? st.badge : `<span class="badge b-ok">${row.status}</span>`;

  const doorStr = row.door_start ? `${row.door_start} – ${row.door_end || '—'}` : '—';
  const durMin = row.duration_min;
  const durStr = durMin != null
    ? `<span class="${durMin >= 60 ? 'long' : ''}">${fmtDur(durMin)}</span>`
    : '—';
  const pmsStr = row.occ_start ? `${row.occ_start} – ${row.occ_end || '—'}` : '—';

  let diffStr = '—';
  if (row.ci_diff != null && row.co_diff != null) {
    const f = v => (v >= 0 ? '+' : '') + Math.round(v);
    diffStr = `<span class="${Math.abs(row.ci_diff) > 30 ? 'diff-bad' : 'diff-ok'}">${f(row.ci_diff)} min</span>` +
              ` / <span class="${Math.abs(row.co_diff) > 60 ? 'diff-bad' : 'diff-ok'}">${f(row.co_diff)} min</span>`;
  } else if (row.status === 'occ_only') {
    diffStr = '<span class="alert-msg">Sin cierre de puerta</span>';
  }

  if (row.status === 'door_only') {
    return `<tr class="${rowCls}">
      <td>${row.room}</td><td>${badge}</td><td>${doorStr}</td><td>${durStr}</td>
      <td colspan="3" class="alert-msg">Puerta cerrada ${fmtDur(durMin)} — sin venta registrada</td>
    </tr>`;
  }

  return `<tr class="${rowCls}">
    <td>${row.room}</td><td>${badge}</td><td>${doorStr}</td><td>${durStr}</td>
    <td>${pmsStr}</td><td>${row.payment || '—'}</td><td>${diffStr}</td>
  </tr>`;
}

// ─────────────────────────────────────────────────────────────
//  Navegación
// ─────────────────────────────────────────────────────────────
document.getElementById('btnPrev').addEventListener('click', () => {
  if (currentIdx < dates.length - 1) show(currentIdx + 1);
});
document.getElementById('btnNext').addEventListener('click', () => {
  if (currentIdx > 0) show(currentIdx - 1);
});
document.getElementById('dateJump').addEventListener('change', e => {
  const d = e.target.value;
  if (dateSet.has(d)) {
    show(dates.indexOf(d));
  } else {
    // no hay reporte ese día: ir al publicado más cercano hacia atrás
    const anterior = dates.find(x => x <= d);
    if (anterior) show(dates.indexOf(anterior));
    e.target.value = anterior || dates[currentIdx];
  }
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft'  && currentIdx < dates.length - 1) show(currentIdx + 1);
  if (e.key === 'ArrowRight' && currentIdx > 0) show(currentIdx - 1);
});

init();
</script>
</body>
</html>
